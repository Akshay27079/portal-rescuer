<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Rescuer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────── -->
  <header class="pr-header">
    <div class="pr-header__logo">
      <img src="../../assets/icons/icon32.png" alt="Portal Rescuer" width="24" height="24" />
      <span class="pr-header__title">Portal Rescuer</span>
    </div>
    <div class="pr-header__badge" id="statusBadge" title="Extension status">
      <span class="pr-badge pr-badge--active">Active</span>
    </div>
  </header>

  <!-- ── Current page panel ─────────────────────────────────────── -->
  <section class="pr-section" id="currentPageSection">
    <h2 class="pr-section__title">Current Page</h2>

    <div class="pr-card pr-card--current" id="currentPageCard">
      <div class="pr-card__row">
        <span class="pr-card__label">Page</span>
        <span class="pr-card__value pr-truncate" id="currentPageTitle">—</span>
      </div>
      <div class="pr-card__row">
        <span class="pr-card__label">Fields tracked</span>
        <span class="pr-card__value" id="currentFieldCount">—</span>
      </div>
      <div class="pr-card__row">
        <span class="pr-card__label">Last saved</span>
        <span class="pr-card__value" id="currentLastSaved">—</span>
      </div>

      <div class="pr-card__actions">
        <button class="pr-btn pr-btn--primary" id="btnForceRefill" title="Refill form fields from the last saved snapshot">
          ↩ Restore Fields
        </button>
        <button class="pr-btn pr-btn--danger" id="btnDiscardSession" title="Delete saved data for this page">
          🗑 Discard
        </button>
      </div>
    </div>

    <p class="pr-empty" id="noCurrentPage" hidden>
      No form activity detected on this page.
    </p>
  </section>

  <!-- ── Retry queue ────────────────────────────────────────────── -->
  <section class="pr-section" id="retrySection">
    <h2 class="pr-section__title">
      Retry Queue
      <span class="pr-count" id="retryCount">0</span>
    </h2>

    <ul class="pr-job-list" id="retryJobList" aria-label="Retry jobs"></ul>

    <p class="pr-empty" id="noRetryJobs">All clear — no pending retries.</p>

    <button class="pr-btn pr-btn--ghost pr-btn--sm" id="btnClearSucceeded">
      Clear completed
    </button>
  </section>

  <!-- ── Saved sessions ─────────────────────────────────────────── -->
  <section class="pr-section" id="sessionsSection">
    <h2 class="pr-section__title">
      Saved Sessions
      <span class="pr-count" id="sessionCount">0</span>
    </h2>

    <ul class="pr-session-list" id="sessionList" aria-label="Saved sessions"></ul>

    <p class="pr-empty" id="noSessions">No saved sessions yet.</p>
  </section>

  <!-- ── Footer ─────────────────────────────────────────────────── -->
  <footer class="pr-footer">
    <button class="pr-btn pr-btn--ghost pr-btn--sm" id="btnOpenOptions">
      ⚙ Settings
    </button>
    <span class="pr-version">v1.0.0</span>
  </footer>

  <!-- ── Toast container ────────────────────────────────────────── -->
  <div class="pr-toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="popup.js"></script>
</body>
</html>
